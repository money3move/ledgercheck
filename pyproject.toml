[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "money3move-ledgercheck"
version = "0.1.0"
description = "对账重在定位差异，不在加总"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "money3move" }]
keywords = ["reconciliation", "ledger", "accounting", "diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/money3move/ledgercheck"
Repository = "https://github.com/money3move/ledgercheck"
Issues = "https://github.com/money3move/ledgercheck/issues"

[project.scripts]
ledgercheck = "ledgercheck:main"

[tool.setuptools]
py-modules = ["ledgercheck"]
